<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OOTD in Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="page-shell">
    <section class="main-box" aria-label="Login">
      <h1 class="title">Hello!</h1>
      <div class="subtitle">
        <p>Create your own outfits</p>
        <p>Make your daily styling in advance</p>
      </div>

      <div class="input-box">
        <label for="user-id">ID</label>
        <input id="user-id" type="text" placeholder="Enter your ID" />
      </div>

      <div class="input-box" style="margin-top: -12px; margin-bottom: 15px;">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your Password" />
      </div>

      <button class="submit-button" type="button" onclick="location.href='main.html'">Log in</button>

      <p class="help-text" style="margin-top: -23px;">I forgot my ID | I don’t have an ID</p>
    </section>
  </main>
</body>
</html>
