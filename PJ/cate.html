  <script>
    const appShell = document.querySelector('.app-shell');
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    const closeBtn = document.getElementById('closeBtn');
    const groups = document.querySelectorAll('.menu-group');

    const openSidebar = () => {
      sidebar.classList.add('open');
      appShell.classList.add('sidebar-open');
    };

    const closeSidebar = () => {
      sidebar.classList.remove('open');
      appShell.classList.remove('sidebar-open');
    };
    
    groups.forEach(group => {
      const header = group.querySelector('.menu-group-header');
      
      header.addEventListener('click', () => {
        group.classList.toggle('open');
      });
    });
    
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (sidebar.classList.contains('open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    });
    
    closeBtn.addEventListener('click', () => {
      closeSidebar();
    });

const params = new URLSearchParams(window.location.search);

const currentCategory =
  params.get("category") || "Category1";

const type =
  params.get("type") || "clothes";


const clothesData =
  JSON.parse(localStorage.getItem("clothesData")) || [];

const outfitsData =
  JSON.parse(localStorage.getItem("outfitsData")) || [];

const data =
  type === "outfits"
    ? outfitsData
    : clothesData;



let selectedClothesId = null;
let editingId = null;

document.getElementById(
  "categoryTitle"
).textContent =
  currentCategory;


const sampleClothes = [

  {
    id: -1,
    image: "images/h1.png",
    name: "Black Hoodie",
    memo: "Winter favorite",
    category: ["Category1"],
    tags: ["casual", "winter"],
    favorite: true
  },

  {
    id: -2,
    image: "images/p1.png",
    name: "Blue Jeans",
    category: ["Category2"],
    favorite: false
  },

  {
    id: -3,
    image: "images/p2.png",
    name: "Cargo Pants",
    category: ["Category3"],
    favorite: true
  }

];

const sampleOutfits = []; // (있으면 넣고, 없으면 빈 배열)


const items =
  type === "outfits"
    ? [...outfitsData]
    : [...sampleClothes, ...clothesData];

const filteredItems =
  items.filter(item =>
    item.category.includes(currentCategory)
  );


const categoryGrid =
  document.getElementById(
    "categoryGrid"
  );

filteredItems.forEach(item => {

  const card =
    document.createElement("div");

  card.className =
    "category-item";
  
  card.dataset.id = item.id;

  card.innerHTML = `

    <img src="${item.image}">

    ${
      item.favorite
      ? '<span class="category-star">⭐</span>'
      : ''
    }

  `;

  categoryGrid.appendChild(card);

});


document.addEventListener(
  "click",
  (e) => {

    const card =
      e.target.closest(".category-item");

    if (!card) return;

    const id =
      Number(card.dataset.id);

const item =
  items.find(c => c.id === id);

    if (!item) return;

    openDetailModal(item);

  }
);


document.querySelectorAll(".category-item")
  .forEach(card => {

    card.addEventListener(
      "click",
      () => {
        console.log("card click");
      }
    );

  });




    const detailModal =
      document.getElementById("detailModal");

    const detailImage =
      document.getElementById("detailImage");

    const detailName =
      document.getElementById("detailName");

    const detailMemo =
      document.getElementById("detailMemo");

    const detailCategory =
      document.getElementById("detailCategory");

    const detailTags =
      document.getElementById("detailTags");

    const detailFavorite =
      document.getElementById("detailFavorite");

    const closeDetailBtn =
      document.getElementById("closeDetailBtn");


function openDetailModal(item){

  console.log("openDetailModal 시작");
  console.log(item);

  selectedClothesId = item.id;

  detailModal.classList.add("show");

  detailImage.src = item.image;

  detailName.value =
    item.name || "";

  detailMemo.value =
    item.memo || "";

  detailCategory.textContent =
    item.category.join(", ");

  detailFavorite.textContent =
    item.favorite
      ? "★ Favorite"
      : "";

  detailTags.innerHTML = "";

  (item.tags || []).forEach(tag => {

    const tagElement =
      document.createElement("span");

    tagElement.className =
      "tag-item";

    tagElement.textContent =
      tag;

    detailTags.appendChild(
      tagElement
    );
  });

  console.log("모달 열기 완료");
}



    closeDetailBtn.addEventListener(
      "click",
      () => {

        detailModal.classList.remove(
          "show"
        );
      }
    );


    document
      .getElementById("deleteBtn")
      .addEventListener(
        "click",
        () => {

          if (selectedClothesId < 0) {
            alert("기본 샘플 이미지는 삭제할 수 없습니다.");
            return;
          };

          const clothes =
            JSON.parse(
              localStorage.getItem(
                "clothesData"
              )
            ) || [];

          const filtered =
            clothes.filter(
              c =>
                c.id !==
                selectedClothesId
            );

          localStorage.setItem(
            "clothesData",
            JSON.stringify(filtered)
          );

          location.reload();
        }
      );


const editModal =
  document.getElementById("editModal");

const editImage =
  document.getElementById("editImage");

const editName =
  document.getElementById("edit-name");

const editMemo =
  document.getElementById("edit-memo");

const editFavBtn =
  document.getElementById("editFavBtn");

const editTagList =
  document.getElementById("editTagList");

const editTagInput =
  document.getElementById("editTagInput");

let editTags = [];


function openEditModal(item){

  editingId = item.id;

  detailModal.classList.remove("show");

  editModal.classList.add("show");

  editImage.src = item.image;

  editName.value =
    item.name || "";

  editMemo.value =
    item.memo || "";

  editTags =
    [...(item.tags || [])];

  renderEditTags();

  document
    .querySelectorAll(
      'input[name="edit-category"]'
    )
    .forEach(cb => {

      const text =
        cb.nextElementSibling.textContent
        .trim();

      cb.checked =
        item.category.includes(text);

    });

  if(item.favorite){

    editFavBtn.classList.add(
      "active"
    );

  }else{

    editFavBtn.classList.remove(
      "active"
    );
  };
}


function renderEditTags(){

  editTagList.innerHTML = "";

  editTags.forEach(tag => {

    const tagItem =
      document.createElement("div");

    tagItem.className =
      "tag-item";

    tagItem.innerHTML = `
      <span>${tag}</span>
      <span class="tag-remove">✕</span>
    `;

    tagItem
      .querySelector(".tag-remove")
      .addEventListener(
        "click",
        () => {

          editTags =
            editTags.filter(
              t => t !== tag
            );

          renderEditTags();
        }
      );

    editTagList.appendChild(
      tagItem
    );
  });
}

editTagInput.addEventListener(
  "keydown",
  (e) => {

    if (e.key !== "Enter") return;

    e.preventDefault();

    const value =
      editTagInput.value.trim();

    if (!value) return;

    if (editTags.includes(value)) {

      editTagInput.value = "";
      return;
    }

    editTags.push(value);

    renderEditTags();

    editTagInput.value = "";
  }
);


editFavBtn.addEventListener(
  "click",
  () => {

    editFavBtn.classList.toggle(
      "active"
    );

  }
);

document
  .getElementById("saveEditBtn")
  .addEventListener(
    "click",
    saveEditedClothes
  );


function saveEditedClothes(){

  const saved =
    JSON.parse(
      localStorage.getItem(
        "clothesData"
      )
    ) || [];

  const index =
    saved.findIndex(
      c => c.id === editingId
    );

  if(index === -1) return;

  const checkedCategories =
    [...document.querySelectorAll(
      'input[name="edit-category"]:checked'
    )]
    .map(cb =>
      cb.nextElementSibling.textContent
    );

  saved[index] = {

    ...saved[index],

    name:
      editName.value,

    memo:
      editMemo.value,

    tags:
      [...editTags],

    category:
      checkedCategories,

    favorite:
      editFavBtn.classList.contains(
        "active"
      )
  };

  localStorage.setItem(
    "clothesData",
    JSON.stringify(saved)
  );

  editModal.classList.remove(
    "show"
  );

  location.reload();
}



document
  .getElementById("editBtn")
  .addEventListener(
    "click",
    () => {

      const item =
        clothes.find(
          c => c.id === selectedClothesId
        );

      if (!item) return;

      if(item.id < 0){
        alert("샘플 이미지는 수정할 수 없습니다.");
        return;
      }

      openEditModal(item);

    }
  );

document
  .getElementById("closeEditBtn")
  .addEventListener(
    "click",
    () => {

      editModal.classList.remove(
        "show"
      );

      editingId = null;
    }
  );
  </script>
  <script src="theme.js"></script>
