  <div class="modal-overlay" id="modalOverlay">

        <div class="input-box">

  <script>

    let layers = [
      {
        id: 1,
        name: "Layer 1",
        visible: true,
        items: []
      }
    ];

    let selectedLayerId = 1;

    

    const appShell = document.querySelector('.app-shell');
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    const closeBtn = document.getElementById('closeBtn');
    const groups = document.querySelectorAll('.menu-group');

    const openSidebar = () => {
      sidebar.classList.add('open');
      appShell.classList.add('sidebar-open');
    };

    const closeSidebar = () => {
      sidebar.classList.remove('open');
      appShell.classList.remove('sidebar-open');
    };
    
    groups.forEach(group => {
      const header = group.querySelector('.menu-group-header');
      
      header.addEventListener('click', () => {
        group.classList.toggle('open');
      });
    });
    
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (sidebar.classList.contains('open')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    });
    
    closeBtn.addEventListener('click', () => {
      closeSidebar();
    });

    const saveBtn = document.getElementById('saveBtn');

    const modalOverlay = document.getElementById('modalOverlay');
    const modalImage = document.getElementById('modalImage');
    const closeModal = document.getElementById('closeModal');

    let currentImage = null;

    /* =========================
      OPEN MODAL
    ========================= */

    function openModal(url = "") {
      modalOverlay.classList.add('show');

      if (url) {
        modalImage.src = url;
      }
    }

    saveBtn.addEventListener("click", async () => {

      const canvas =
        await html2canvas(
          document.getElementById(
            "outfitCanvas"
          )
        );

      const imageData =
        canvas.toDataURL("image/png");

      document.getElementById(
        "previewImage"
      ).src = imageData;

      modalOverlay.classList.add("show");

    });

    /* =========================
      CLOSE MODAL
    ========================= */

    closeModal.addEventListener('click', () => {

      saveOutfit();
      modalOverlay.classList.remove('show');
    });

    /* 바깥 클릭 닫기 */
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('show');
      }
    });


    const tagInput = document.getElementById('tagInput');
    const tagList = document.getElementById('tagList');

    let tags = [];

    /* 엔터 입력 */
    tagInput.addEventListener('keydown', (e) => {

      if (e.key !== 'Enter') return;

      e.preventDefault();

      const value = tagInput.value.trim();

      if (!value) return;

      // 중복 방지
      if (tags.includes(value)) {
        tagInput.value = '';
        return;
      }

      tags.push(value);

      renderTags();

      tagInput.value = '';
    });


    /* 태그 렌더링 */
    function renderTags() {

      tagList.innerHTML = '';

      tags.forEach(tag => {

        const tagItem = document.createElement('div');
        tagItem.className = 'tag-item';

        tagItem.innerHTML = `
          <span>${tag}</span>
          <span class="tag-remove">✕</span>
        `;

        /* 삭제 */
        tagItem.querySelector('.tag-remove')
          .addEventListener('click', () => {

            tags = tags.filter(t => t !== tag);

            renderTags();
          });

        tagList.appendChild(tagItem);
      });
    }

    const favBtn = document.getElementById('favBtn');

    favBtn.addEventListener('click', () => {

      favBtn.classList.toggle('active');

    });

    const guideOn = document.getElementById("guideOn");
    const guideOff = document.getElementById("guideOff");

    const guideImages = document.querySelectorAll(".guide-image");

    function showGuide() {

      guideImages.forEach(img => {
        img.style.display = "flex";
      });

      guideOn.classList.add("active");
      guideOff.classList.remove("active");
    }

    function hideGuide() {

      guideImages.forEach(img => {
        img.style.display = "none";
      });

      guideOff.classList.add("active");
      guideOn.classList.remove("active");
    }

    guideOn.addEventListener("click", showGuide);
    guideOff.addEventListener("click", hideGuide);


    const transformPanel =
      document.getElementById("transformPanel");

    const scaleSlider =
      document.getElementById("scaleSlider");

    const rotateSlider =
      document.getElementById("rotateSlider");

    const deleteBtn =
      document.getElementById("deleteBtn");

    const resetBtn =
      document.getElementById("resetBtn");

    const layerUpBtn =
      document.getElementById("layerUpBtn");

    const layerDownBtn =
      document.getElementById("layerDownBtn");

    let selectedItem = null;


    const clothesPanel =
      document.getElementById("clothesPanel");


const sampleClothes = [

      {
        id: -1,
        image: "images/h1.png",
        name: "Black Hoodie",
        memo: "Winter favorite",
        category: ["Category1"],
        tags: ["casual", "winter"],
        favorite: true
      },

      {
        id: -2,
        image: "images/p1.png",
        name: "Blue Jeans",
        memo: "Wide fit denim",
        category: ["Category2"],
        tags: ["denim"],
        favorite: false
      },

      {
        id: -3,
        image: "images/p2.png",
        name: "Cargo Pants",
        memo: "Daily wear",
        category: ["Category3"],
        tags: ["street", "cargo"],
        favorite: true
      }

    ];

    const clothes = [

      ...sampleClothes,

      ...(JSON.parse(
        localStorage.getItem("clothesData")
      ) || [])

    ];



function renderClothes(category = "all") {

  clothesPanel.innerHTML = "";

  const filtered =
    category === "all"
      ? clothes
      : clothes.filter(item =>
          item.category.includes(category)
        );

  filtered.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "category-item";

    card.innerHTML = `
      <img
        src="${item.image}"
        draggable="true"
        data-id="${item.id}"
      >
    `;

    clothesPanel.appendChild(card);

  });

}


const tabs =
  document.querySelectorAll(
    ".category-tab"
  );

tabs.forEach(tab => {

  tab.addEventListener("click", () => {

    tabs.forEach(t =>
      t.classList.remove("active")
    );

    tab.classList.add("active");

    renderClothes(
      tab.dataset.category
    );

  });

});

renderClothes("all");

    /* =========================
      DRAG & DROP
    ========================= */

    // const categoryImages =
    //   document.querySelectorAll(".category-item img");

    const centerContent =
      document.querySelector(".center-content");

    let draggedSrc = "";

    /* 왼쪽 이미지 드래그 */

    // categoryImages.forEach(img => {

    //   img.addEventListener("dragstart", () => {

    //     draggedSrc = img.src;

    //   });

    // });

    document.addEventListener("dragstart", (e) => {

      if (
        e.target.matches(
          ".category-item img"
        )
      ) {

        draggedSrc =
          e.target.src;

      }

    });

    /* 캔버스 드롭 허용 */

    centerContent.addEventListener("dragover", (e) => {

      e.preventDefault();

    });

    /* 캔버스에 이미지 생성 */

    centerContent.addEventListener("drop", (e) => {

      e.preventDefault();

      const rect =
        centerContent.getBoundingClientRect();

      const x =
        e.clientX - rect.left;

      const y =
        e.clientY - rect.top;

      const outfit =
        document.createElement("img");

      outfit.dataset.z = 1;

      outfit.style.zIndex = 1;  

      outfit.src = draggedSrc;

      outfit.classList.add("outfit-item");

      outfit.draggable = false;

      outfit.style.left =
        `${x - 90}px`;

      outfit.style.top =
        `${y - 90}px`;

      centerContent.appendChild(outfit);

      const currentLayer =
        layers.find(
          l =>
            l.id ===
            selectedLayerId
        );

      if (currentLayer) {

        currentLayer.items.push(outfit);

      }

      makeDraggable(outfit);
      makeSelectable(outfit);

      renderLayers();

    });

    /* =========================
      MOVE OUTFIT
    ========================= */

    function makeDraggable(item) {

      let isDragging = false;

      let offsetX = 0;
      let offsetY = 0;

      item.addEventListener("mousedown", (e) => {

        isDragging = true;

        offsetX =
          e.clientX - item.offsetLeft;

        offsetY =
          e.clientY - item.offsetTop;

      });

      document.addEventListener("mousemove", (e) => {

        if (!isDragging) return;

        item.style.left =
          `${e.clientX - offsetX}px`;

        item.style.top =
          `${e.clientY - offsetY}px`;

      });

      document.addEventListener("mouseup", () => {

        isDragging = false;

      });

    }

    function makeSelectable(item) {

      item.dataset.scale = 1;
      item.dataset.rotate = 0;

      item.addEventListener("click", (e) => {

        e.stopPropagation();

        document
          .querySelectorAll(".outfit-item")
          .forEach(img =>
            img.classList.remove("selected")
          );

        item.classList.add("selected");

        selectedItem = item;

        transformPanel.classList.remove("hidden");

        const layer =
          layers.find(
            l => l.element === item
          );

        if (layer) {
          selectedLayerId = layer.id;
        }

        renderLayers();
      });

    };

    centerContent.addEventListener("click", () => {

      selectedItem?.classList.remove("selected");

      selectedItem = null;

      transformPanel.classList.add("hidden");

      selectedLayerId = null;
      renderLayers();

    });

    scaleSlider.addEventListener("input", () => {

      if (!selectedItem) return;

      selectedItem.dataset.scale =
        scaleSlider.value / 100;

      updateTransform(selectedItem);

    });


    rotateSlider.addEventListener("input", () => {

      if (!selectedItem) return;

      let angle = Number(rotateSlider.value);

      const snapAngles = [
        -180,
        -90,
        0,
        90,
        180
      ];

      const snapDistance = 15;

      for (const snap of snapAngles) {

        if (Math.abs(angle - snap) <= snapDistance) {

          angle = snap;

          rotateSlider.value = snap;

          break;
        }
      }

      selectedItem.dataset.rotate = angle;

      updateTransform(selectedItem);

    });

    resetBtn.addEventListener("click", () => {

      if (!selectedItem) return;

      selectedItem.dataset.scale = 1;
      selectedItem.dataset.rotate = 0;

      scaleSlider.value = 100;
      rotateSlider.value = 0;

      updateTransform(selectedItem);

    });

    // layerUpBtn.addEventListener("click", () => {

    //   if (!selectedItem) return;

    //   let z =
    //     Number(selectedItem.dataset.z);

    //   z++;

    //   selectedItem.dataset.z = z;
    //   selectedItem.style.zIndex = z;

    // });

    // layerDownBtn.addEventListener("click", () => {

    //   if (!selectedItem) return;

    //   let z =
    //     Number(selectedItem.dataset.z);

    //   z--;

    //   if (z < 1) z = 1;

    //   selectedItem.dataset.z = z;
    //   selectedItem.style.zIndex = z;

    // });

    layerUpBtn.addEventListener("click", () => {

      if (!selectedItem) return;

      const outfits =
        [...centerContent.querySelectorAll(".outfit-item")];

      const currentIndex =
        outfits.indexOf(selectedItem);

      if (currentIndex === outfits.length - 1) return;

      const nextItem =
        outfits[currentIndex + 1];

      const temp =
        document.createComment("");

      selectedItem.replaceWith(temp);

      nextItem.replaceWith(selectedItem);

      temp.replaceWith(nextItem);

    });

    layerDownBtn.addEventListener("click", () => {

      if (!selectedItem) return;

      const outfits =
        [...centerContent.querySelectorAll(".outfit-item")];

      const currentIndex =
        outfits.indexOf(selectedItem);

      if (currentIndex === 0) return;

      const prevItem =
        outfits[currentIndex - 1];

      const temp =
        document.createComment("");

      selectedItem.replaceWith(temp);

      prevItem.replaceWith(selectedItem);

      temp.replaceWith(prevItem);

    });

    deleteBtn.addEventListener("click", () => {

      if (!selectedItem) return;

      selectedItem.classList.remove("selected");

      selectedItem.remove();

      selectedItem = null;

      transformPanel.classList.add("hidden");

    });

    transformPanel.addEventListener("click", (e) => {

      e.stopPropagation();

    });

    function updateTransform(item) {

      const scale =
        Number(item.dataset.scale || 1);

      const rotate =
        Number(item.dataset.rotate || 0);

      item.style.transform =
        `scale(${scale}) rotate(${rotate}deg)`;

    };

    const addLayerBtn =
      document.querySelector(
        ".add-layer-btn"
      );

    addLayerBtn.addEventListener(
      "click",
      () => {

        const layer = {
          id: Date.now(),
          name:
            `Layer ${layers.length + 1}`,
          visible: true,
          items: []
        };

        layers.push(layer);

        selectedLayerId =
          layer.id;

        renderLayers();

      }
    );


    const outfitCanvas =
      document.getElementById("outfitCanvas");





    function renderLayers() {

      const list =
        document.getElementById(
          "layersList"
        );

      list.innerHTML = "";

      [...layers]
        .reverse()
        .forEach(layer => {

          const row =
            document.createElement("div");

          row.className =
            layer.id === selectedLayerId
            ? "layer-item selected"
            : "layer-item";

          if (
            layer.id ===
            selectedLayerId
          ) {
            row.classList.add(
              "selected"
            );
          }

          row.innerHTML = `

            <span>
              ${layer.name}
              (${layer.items.length})
            </span>

            <div class="layer-actions">

              <button class="layer-eye">
                ${layer.visible ? "👁" : "🚫"}
              </button>

              <button class="layer-delete">
                ✕
              </button>

            </div>

          `;

          row.addEventListener(
            "click",
            () => {

              selectedLayerId =
                layer.id;

              renderLayers();

            }
          );

          const eye =
            row.querySelector(
              ".layer-eye"
            );

          eye.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              layer.visible =
                !layer.visible;

              layer.items.forEach(
                item => {

                  item.style.display =
                    layer.visible
                    ? "block"
                    : "none";

                }
              );

              renderLayers();

            }
          );

          const deleteBtn =
            row.querySelector(
              ".layer-delete"
            );

          deleteBtn.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              // 마지막 레이어는 삭제 불가
              if (layers.length === 1) {
                alert(
                  "At least one layer is required."
                );
                return;
              }

              // 레이어 안 이미지 삭제
              layer.items.forEach(item => {
                item.remove();
              });

              // 레이어 삭제
              layers =
                layers.filter(
                  l => l.id !== layer.id
                );

              // 선택된 레이어 삭제 시
              if (
                selectedLayerId ===
                layer.id
              ) {

                selectedLayerId =
                  layers[0].id;

              }

              renderLayers();

            }
          );

          list.appendChild(row);

        });

    };

    renderLayers();


function saveOutfit() {

  const outfits =
    JSON.parse(localStorage.getItem("outfitsData")) || [];

  const checkedCategories =
    [...document.querySelectorAll('input[name="category"]:checked')]
      .map(cb => cb.nextElementSibling.textContent);

  const outfit = {
    id: Date.now(),

    image: document.getElementById("previewImage").src,

    name: document.getElementById("outfit-name").value,

    memo: document.getElementById("outfit-memo").value,

    category: checkedCategories,

    tags: [...tags],

    favorite: favBtn.classList.contains("active")
  };

  outfits.push(outfit);

  localStorage.setItem(
    "outfitsData",
    JSON.stringify(outfits)
  );
}
    </script>
